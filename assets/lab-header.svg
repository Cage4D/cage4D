<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 96" width="840" height="96" role="img" aria-label="experiments that escaped the lab">
<style>
svg{--ink:#1f2328;--mu:#8c959f;--ln:#57606a;--dim:#d0d7de}
@media (prefers-color-scheme:dark){svg{--ink:#ededed;--mu:#6e7681;--ln:#c9d1d9;--dim:#30363d}}
text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.ink{fill:var(--ink)}.mu{fill:var(--mu)}
.ln{stroke:var(--ln);fill:none}.lm{stroke:var(--mu);fill:none}.ld{stroke:var(--dim);fill:none}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}

</style>
<path class="lm" stroke-width="1" d="M14 26 V14 H26 M814 14 H826 V26 M14 70 V82 H26 M814 82 H826 V70"/>
<text class="mu" x="40" y="42" font-size="12">archive</text>
<text class="ink" x="40" y="66" font-size="14">experiments that escaped the lab</text>
<text class="mu" x="800" y="42" font-size="12" text-anchor="end">containment: partial <tspan class="pulse">●</tspan></text>
<text class="mu" x="800" y="66" font-size="12" text-anchor="end">click a specimen to inspect its source</text>
</svg>
