<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-label="github stats for cage4D">
<style>
svg{--ink:#1f2328;--mu:#8c959f;--ln:#57606a;--dim:#d0d7de}
@media (prefers-color-scheme:dark){svg{--ink:#ededed;--mu:#6e7681;--ln:#c9d1d9;--dim:#30363d}}
text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.ink{fill:var(--ink)}.mu{fill:var(--mu)}
.ln{stroke:var(--ln);fill:none}.lm{stroke:var(--mu);fill:none}.ld{stroke:var(--dim);fill:none}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
.sw{transform-origin:176px 156px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hit{0%{opacity:1}70%{opacity:.15}100%{opacity:.15}}
.lg{opacity:0;animation:appear .01s linear forwards}
.gr{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:grow .7s ease-out forwards}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes appear{to{opacity:1}}
.sa0{animation-delay:0.35s}
.sa1{animation-delay:0.65s}
.sa2{animation-delay:0.95s}
.sa3{animation-delay:1.25s}
.sa4{animation-delay:1.55s}
.sa5{animation-delay:1.85s}
.sa6{animation-delay:2.15s}
</style>
