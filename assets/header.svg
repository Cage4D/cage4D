<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="cage4D">
<style>
svg{--ink:#1f2328;--mu:#8c959f;--ln:#57606a;--dim:#d0d7de}
@media (prefers-color-scheme:dark){svg{--ink:#ededed;--mu:#6e7681;--ln:#c9d1d9;--dim:#30363d}}
text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.ink{fill:var(--ink)}.mu{fill:var(--mu)}
.ln{stroke:var(--ln);fill:none}.lm{stroke:var(--mu);fill:none}.ld{stroke:var(--dim);fill:none}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}
.r1{transform-origin:420px 120px;animation:spin 24s linear infinite}
.r2{transform-origin:420px 120px;animation:spin 40s linear infinite reverse}
.orb{transform-origin:420px 120px;animation:spin 9s linear infinite}
.t{font-size:15px;letter-spacing:1px}.s{font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
